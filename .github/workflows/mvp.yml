name: MVP acceptance
on:
  pull_request:
  push:
    branches: [main]
jobs:
  install-and-edit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        layout: [public, webroot]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cms_mvp
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: 'mvp$quote"slash\2026'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms -d cms_mvp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CMS_VERSION: 0.1.${{ github.run_number }}
      MVP_LAYOUT: ${{ matrix.layout }}
      MVP_BROWSER_STATE: /tmp/cms-browser-state.json
      MVP_DB_NAME: cms_mvp
      MVP_DB_USER: cms
      MVP_DB_PASS: 'mvp$quote"slash\2026'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, dom, mbstring, zip
          coverage: none
      - run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress
      - name: Update engine integration tests
        run: php tests/update_smoke.php
      - name: Build standard updater module
        run: python3 tools/package_module.py updater /tmp/updater-module.zip
      - name: Live official release update
        if: matrix.layout == 'public'
        run: php tests/update_release_smoke.php
      - name: Build clean hosting archive
        run: |
          if [ "$MVP_LAYOUT" = webroot ]; then
            python3 tools/package_mvp.py /tmp/ultima-vox-cms-mvp-webroot.zip --webroot
            mkdir /tmp/cms-webroot
            unzip -q /tmp/ultima-vox-cms-mvp-webroot.zip -d /tmp/cms-webroot
          else
            python3 tools/package_mvp.py /tmp/ultima-vox-cms-mvp.zip
            mkdir /tmp/cms-public
            unzip -q /tmp/ultima-vox-cms-mvp.zip -d /tmp/cms-public
          fi
      - name: Set up browser layout verification
        if: matrix.layout == 'public'
        run: |
          npm install --prefix /tmp/cms-browser playwright@1.62.1 --no-package-lock --no-audit --no-fund
          /tmp/cms-browser/node_modules/.bin/playwright install chromium --only-shell
      - name: Fresh browser installation and editing journey
        run: |
          if [ "$MVP_LAYOUT" = webroot ]; then
            INSTALLER_LOCAL_ORIGIN=http://127.0.0.1:8086 PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8086 -t /tmp/cms-webroot /tmp/cms-webroot/index.php > /tmp/cms-mvp-server.log 2>&1 &
          else
            INSTALLER_LOCAL_ORIGIN=http://127.0.0.1:8086 PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8086 -t /tmp/cms-public/public /tmp/cms-public/public/index.php > /tmp/cms-mvp-server.log 2>&1 &
          fi
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for n in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8086/install; then break; fi
            sleep 1
          done
          python3 tests/mvp_http_smoke.py
          if [ "$MVP_LAYOUT" = public ]; then
            NODE_PATH=/tmp/cms-browser/node_modules node tests/browser_mvp.cjs
            MVP_EDITOR_BASELINE_DISPOSABLE=1 NODE_PATH=/tmp/cms-browser/node_modules node tests/browser_editor_baseline.cjs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ultima-vox-cms-mvp-${{ matrix.layout }}
          path: /tmp/ultima-vox-cms-mvp*.zip
          retention-days: 30
      - name: Upload browser layout evidence
        if: always() && matrix.layout == 'public'
        uses: actions/upload-artifact@v4
        with:
          name: mvp-browser-layouts
          path: /tmp/cms-layout-*.png
          if-no-files-found: ignore
      - name: Upload editor baseline observations
        if: always() && matrix.layout == 'public'
        uses: actions/upload-artifact@v4
        with:
          name: g0-editor-baseline
          path: /tmp/cms-editor-baseline/
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-failure-diagnostics-${{ matrix.layout }}
          path: /tmp/cms-mvp-server.log

  upgrade-existing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cms_upgrade_runtime
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms -d cms_upgrade_runtime"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CMS_VERSION: 0.1.${{ github.run_number }}
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8087
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: cms_upgrade_runtime
      DB_USER: cms
      DB_PASS: cms
      PGPASSWORD: cms
      CMS_ADMIN_PASSWORD: disposable-upgrade-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, dom, mbstring, zip
          coverage: none
      - run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress
      - name: Build candidate and prepare the real 0.1.20 baseline
        run: |
          python3 tools/package_update.py /tmp/candidate-update.zip
          curl --fail --location --retry 3 https://github.com/ultima-vox/cms/releases/download/v0.1.20/ultima-vox-cms-mvp-webroot.zip -o /tmp/baseline.zip
          mkdir /tmp/cms-upgrade
          unzip -q /tmp/baseline.zip -d /tmp/cms-upgrade
          php /tmp/cms-upgrade/app/bin/console migrate
          php /tmp/cms-upgrade/app/bin/console modules:migrate --all
          php /tmp/cms-upgrade/app/bin/console extensions:sync
          php tests/prepare_upgrade_runtime.php /tmp/cms-upgrade/app
      - name: Apply using loaded baseline classes and then boot a fresh worker
        run: |
          php tests/update_existing_runtime_smoke.php /tmp/cms-upgrade/app /tmp/candidate-update.zip
          php -S 127.0.0.1:8087 -t /tmp/cms-upgrade /tmp/cms-upgrade/index.php > /tmp/upgrade-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for n in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8087/; then break; fi
            sleep 1
          done
          python3 tests/update_existing_runtime_http.py
      - name: Upgrade failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-failure-diagnostics
          path: /tmp/upgrade-server.log

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [install-and-edit, upgrade-existing]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      CMS_VERSION: 0.1.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for full CI on this exact commit
        run: |
          for attempt in $(seq 1 60); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.workflow_runs[0] | if .status == "completed" then .conclusion else "pending" end')
            if [ "$result" = success ]; then exit 0; fi
            if [ "$result" != pending ] && [ "$result" != null ]; then exit 1; fi
            sleep 10
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: ultima-vox-cms-mvp-*
          path: /tmp/release-artifacts
          merge-multiple: true
      - name: Build layout-neutral update
        run: |
          unzip -q /tmp/release-artifacts/ultima-vox-cms-mvp.zip 'vendor/*' -d .
          python3 tools/package_update.py /tmp/release-artifacts/cms-update.zip
          python3 tools/package_module.py updater /tmp/release-artifacts/updater-module.zip
      - name: Publish tested development release
        run: |
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path('/tmp/release-artifacts/update.json').read_text())
          pathlib.Path('/tmp/release-notes.md').write_text('\n'.join('- ' + c for c in m['changes']) + '\n')
          PY
          gh release create "v$CMS_VERSION" /tmp/release-artifacts/*.zip /tmp/release-artifacts/update.json --target "$GITHUB_SHA" --title "Vox CMS $CMS_VERSION" --notes-file /tmp/release-notes.md --latest
