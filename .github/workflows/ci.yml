name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cms_db
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms -d cms_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://127.0.0.1:8080
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: cms_db
      DB_USER: cms
      DB_PASS: cms

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, dom, mbstring, zip
          coverage: none

      - name: Repository hygiene check
        run: |
          test -z "$(git ls-files vendor)"
          test -z "$(git ls-files '*.twig')"

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          find core public templates tests modules -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l bin/console

      - name: Native PHP template syntax check
        run: php bin/console templates:lint

      - name: Twig-free architecture check
        run: |
          test -z "$(find core modules templates -type f -name '*.twig' -print -quit)"
          ! grep -R -n -i --include='*.php' 'twig' core modules templates
          ! grep -R -n 'TwigRenderer\|TwigTemplateLinter\|AdminTwigRendererFactory' core modules tests bin
          ! grep -n '"twig/twig"' composer.json composer.lock
          ! grep -R -n 'name: Legacy/admin T[w]ig syntax check' .github/workflows bin

      - name: Infosystem legacy content architecture check
        run: |
          ! grep -R -n "include_content\|node:.*:content\|context->node.*content" modules/infosystem/src

      - name: Node content runtime architecture check
        run: |
          ! grep -n "n\.content\|node.*content" core/Repository/NodeRepository.php
          ! grep -R -n "node:.*:content\|context->node.*content" core modules --include='*.php'

      - name: Extension and render runtime smoke test
        run: php tests/runtime_smoke.php

      - name: HTML sanitizer smoke test
        run: php tests/html_sanitizer_smoke.php

      - name: Module manifest smoke test
        run: |
          php tests/module_manifest_smoke.php
          php bin/console modules:list | grep $'^infosystem\t1.2.0\tInfosystems$'

      - name: Apply migrations
        run: php bin/console migrate

      - name: Full updater module integration
        env:
          PGPASSWORD: cms
        run: |
          python3 tools/package_module.py updater /tmp/updater-module.zip
          psql -h 127.0.0.1 -U cms -d postgres -c 'CREATE DATABASE cms_updates_test;'
          trap 'psql -h 127.0.0.1 -U cms -d postgres -c "DROP DATABASE IF EXISTS cms_updates_test;"' EXIT
          DB_NAME=cms_updates_test php tests/update_module_smoke.php

      - name: Fresh database module migration pipeline
        env:
          PGPASSWORD: cms
        run: |
          psql -h 127.0.0.1 -U cms -d postgres -c 'CREATE DATABASE cms_pipeline;'
          trap 'psql -h 127.0.0.1 -U cms -d postgres -c "DROP DATABASE IF EXISTS cms_pipeline;"' EXIT
          export DB_NAME=cms_pipeline
          php bin/console migrate
          php bin/console modules:migrate --all
          php bin/console modules:migrate --all | grep 'No pending migrations for enabled modules.'
          psql -h 127.0.0.1 -U cms -d cms_pipeline -Atc "SELECT COUNT(*) FROM module_schema_migrations WHERE module_code = 'documents' AND migration = '005_drop_legacy_node_content.sql';" | grep -x '1'

      - name: Legacy database module migration pipeline
        env:
          PGPASSWORD: cms
        run: |
          psql -h 127.0.0.1 -U cms -d postgres -c 'CREATE DATABASE cms_upgrade;'
          trap 'psql -h 127.0.0.1 -U cms -d postgres -c "DROP DATABASE IF EXISTS cms_upgrade;"' EXIT
          export DB_NAME=cms_upgrade
          php bin/console migrate
          php tests/module_migration_upgrade_smoke.php
          php bin/console modules:migrate --all | grep 'No pending migrations for enabled modules.'

      - name: Migration checksum smoke test
        run: php tests/migration_checksum_smoke.php

      - name: Enabled module migration pipeline check
        run: |
          php bin/console modules:migrate --all
          php bin/console modules:migrate --all | grep 'No pending migrations for enabled modules.'

      - name: Reserved system path smoke test
        run: php tests/system_path_smoke.php

      - name: Sync extension metadata
        run: php bin/console extensions:sync

      - name: Portable database repository contract
        run: php tests/database_driver_smoke.php

      - name: Document search and bounded list pagination
        run: php tests/document_list_smoke.php

      - name: Site-scoped content folders
        run: php tests/content_folders_smoke.php

      - name: Admin delivery invalidation integration test
        run: php tests/delivery_invalidation_routes_smoke.php

      - name: Module lifecycle smoke test
        run: |
          php bin/console extensions:list | grep $'^infosystem\t1.2.0\tenabled\t\^1.0\tInfosystems$'
          php tests/module_lifecycle_smoke.php
          php bin/console extensions:list | grep $'^infosystem\t1.2.0\tenabled\t\^1.0\tInfosystems$'

      - name: Extension permission sync smoke test
        run: |
          infosystems_count="$(psql -h 127.0.0.1 -U cms -d cms_db -Atc "
            SELECT COUNT(*)
            FROM role_permissions rp
            JOIN roles r ON r.id = rp.role_id
            JOIN permissions p ON p.id = rp.permission_id
            WHERE p.code = 'infosystems.manage'
              AND r.code IN ('superadmin', 'admin', 'editor');
          ")"
          code_edit_count="$(psql -h 127.0.0.1 -U cms -d cms_db -Atc "
            SELECT COUNT(*)
            FROM role_permissions rp
            JOIN roles r ON r.id = rp.role_id
            JOIN permissions p ON p.id = rp.permission_id
            WHERE p.code = 'templates.code.edit'
              AND r.code IN ('superadmin', 'admin');
          ")"
          editor_code_edit="$(psql -h 127.0.0.1 -U cms -d cms_db -Atc "
            SELECT COUNT(*)
            FROM role_permissions rp
            JOIN roles r ON r.id = rp.role_id
            JOIN permissions p ON p.id = rp.permission_id
            WHERE p.code = 'templates.code.edit'
              AND r.code = 'editor';
          ")"
          test "$infosystems_count" = "3"
          test "$code_edit_count" = "1"
          test "$editor_code_edit" = "0"
        env:
          PGPASSWORD: cms

      - name: Database health check
        run: php bin/console health

      - name: Seed smoke-test content
        run: |
          psql -h 127.0.0.1 -U cms -d cms_db <<'SQL'
          INSERT INTO documents (site_id, code, name)
          VALUES
            (1, 'ci-home', 'Ultima Vox CMS'),
            (1, 'ci-about', 'About');

          INSERT INTO document_versions (document_id, version, content, status, published_at)
          SELECT id, 1,
            CASE code
              WHEN 'ci-home' THEN '<p>Production Core</p>'
              WHEN 'ci-about' THEN '<p>About</p>'
            END,
            'published',
            CURRENT_TIMESTAMP
          FROM documents
          WHERE site_id = 1
            AND code IN ('ci-home', 'ci-about');

          INSERT INTO nodes (site_id, name, slug, path, title, layout_id, status, page_type, page_config)
          VALUES (
            1, 'Home', '', '/', 'Ultima Vox CMS',
            (SELECT id FROM layouts WHERE template_path = 'layouts/main.html.php'),
            'published', 'infosystem.list', '{}'::jsonb
          );
          INSERT INTO nodes (site_id, parent_id, name, slug, path, title, layout_id, status, page_type, page_config)
          VALUES (
            1,
            (SELECT id FROM nodes WHERE site_id = 1 AND path = '/'),
            'About', 'about', '/about', 'About',
            (SELECT id FROM layouts WHERE template_path = 'layouts/main.html.php'),
            'published', 'documents.page', '{"document":"ci-about"}'::jsonb
          );

          INSERT INTO infosystems (site_id, name, code, description, field_schema)
          VALUES (
            1,
            'Catalog',
            'catalog',
            'CI catalog',
            '[{"code":"kind","name":"Kind","type":"select","required":true,"filterable":true,"options":["bio","septic"]},{"code":"capacity","name":"Capacity","type":"number","required":false,"filterable":true,"options":[]}]'::jsonb
          );

          INSERT INTO infosystem_groups (infosystem_id, name, slug, path)
          VALUES (
            (SELECT id FROM infosystems WHERE site_id = 1 AND code = 'catalog'),
            'Stations', 'stations', '/stations'
          );

          INSERT INTO infosystem_items (
            infosystem_id, group_id, name, slug, path, status, properties, content
          )
          VALUES (
            (SELECT id FROM infosystems WHERE site_id = 1 AND code = 'catalog'),
            (SELECT g.id FROM infosystem_groups g JOIN infosystems s ON s.id = g.infosystem_id WHERE s.site_id = 1 AND g.path = '/stations'),
            'Tank 5', 'tank-5', '/stations/tank-5', 'published',
            '{"kind":"bio","capacity":5}'::jsonb,
            '<p>Tank content</p>'
          );

          INSERT INTO infosystem_items (
            infosystem_id, group_id, name, slug, path, status, properties
          )
          SELECT
            (SELECT id FROM infosystems WHERE site_id = 1 AND code = 'catalog'),
            (SELECT g.id FROM infosystem_groups g JOIN infosystems s ON s.id = g.infosystem_id WHERE s.site_id = 1 AND g.path = '/stations'),
            'Septic ' || n,
            'septic-' || n,
            '/stations/septic-' || n,
            CASE WHEN n % 2 = 0 THEN 'published' ELSE 'draft' END,
            jsonb_build_object('kind', 'septic', 'capacity', n)
          FROM generate_series(1, 60) AS n;

          INSERT INTO node_module_bindings (node_id, module_code, binding_code, target_key)
          SELECT id, 'infosystem', 'primary', 'catalog'
          FROM nodes
          WHERE site_id = 1 AND path = '/';

          INSERT INTO node_module_bindings (node_id, module_code, binding_code, target_key)
          SELECT id, 'documents', 'intro', 'ci-home'
          FROM nodes
          WHERE site_id = 1 AND path = '/';

          INSERT INTO sites (code, name)
          VALUES ('second', 'Second Site');

          INSERT INTO site_domains (site_id, host, is_primary)
          VALUES ((SELECT id FROM sites WHERE code = 'second'), 'second.test', TRUE);

          INSERT INTO documents (site_id, code, name)
          VALUES (
            (SELECT id FROM sites WHERE code = 'second'),
            'ci-second-home',
            'Second Site'
          );

          INSERT INTO document_versions (document_id, version, content, status, published_at)
          SELECT id, 1, '<p>Second Site Content</p>', 'published', CURRENT_TIMESTAMP
          FROM documents
          WHERE site_id = (SELECT id FROM sites WHERE code = 'second')
            AND code = 'ci-second-home';

          INSERT INTO infosystems (site_id, name, code, description, field_schema)
          VALUES (
            (SELECT id FROM sites WHERE code = 'second'),
            'Second Catalog',
            'catalog',
            'Second site catalog',
            '[]'::jsonb
          );

          INSERT INTO infosystem_items (
            infosystem_id, name, slug, path, status, properties, content
          )
          VALUES (
            (SELECT i.id FROM infosystems i JOIN sites s ON s.id = i.site_id WHERE s.code = 'second' AND i.code = 'catalog'),
            'Second Tank', 'second-tank', '/second-tank', 'published',
            '{"kind":"second"}'::jsonb,
            '<p>Second tank content</p>'
          );

          INSERT INTO nodes (
            site_id, name, slug, path, title, layout_id, status, page_type, page_config
          )
          VALUES (
            (SELECT id FROM sites WHERE code = 'second'),
            'Home', '', '/', 'Second Site',
            (SELECT id FROM layouts WHERE template_path = 'layouts/main.html.php'),
            'published', 'infosystem.list', '{}'::jsonb
          );

          INSERT INTO node_module_bindings (node_id, module_code, binding_code, target_key)
          SELECT n.id, 'infosystem', 'primary', 'catalog'
          FROM nodes n
          JOIN sites s ON s.id = n.site_id
          WHERE s.code = 'second' AND n.path = '/';

          INSERT INTO node_module_bindings (node_id, module_code, binding_code, target_key)
          SELECT n.id, 'documents', 'intro', 'ci-second-home'
          FROM nodes n
          JOIN sites s ON s.id = n.site_id
          WHERE s.code = 'second' AND n.path = '/';
          SQL
        env:
          PGPASSWORD: cms

      - name: Generic node-module binding smoke test
        run: php tests/node_module_binding_smoke.php

      - name: Site resolution and isolation smoke test
        run: php tests/site_resolution_smoke.php

      - name: Static page generation integration test
        run: |
          php tests/static_page_generation_smoke.php
          STATIC_OUTPUT="$(php bin/console static:publish second / html)"
          grep 'Second Tank' "${STATIC_OUTPUT#Published: }"
          php bin/console static:prune
          if php bin/console static:prune unexpected; then exit 1; fi
          if php bin/console static:publish second /admin html; then exit 1; fi
          if php bin/console static:publish second / html unexpected; then exit 1; fi

      - name: JSONB repository smoke test
        run: php tests/jsonb_repository_smoke.php

      - name: Infosystem module facade smoke test
        run: php tests/infosystem_module_smoke.php

      - name: Admin item search smoke test
        run: php tests/admin_search_smoke.php

      - name: HTTP smoke test
        run: |
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/cms-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8080/health | grep '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8080/health/live | grep '"check":"liveness"'
          curl --fail --silent http://127.0.0.1:8080/health/ready | grep '"database":"up"'

          DEFAULT_HTML="$(curl --fail --silent http://127.0.0.1:8080/)"
          echo "$DEFAULT_HTML" | grep 'Production Core'
          echo "$DEFAULT_HTML" | grep 'data-infosystem="catalog"'
          echo "$DEFAULT_HTML" | grep 'Tank 5'
          if echo "$DEFAULT_HTML" | grep -q 'Second Tank'; then exit 1; fi

          SECOND_HTML="$(curl --fail --silent --header 'Host: second.test' http://127.0.0.1:8080/)"
          echo "$SECOND_HTML" | grep 'Second Site'
          echo "$SECOND_HTML" | grep 'Second Tank'
          STATIC_SECOND_OUTPUT="$(php bin/console static:publish second / html)"
          test "$SECOND_HTML" = "$(cat "${STATIC_SECOND_OUTPUT#Published: }")"
          if echo "$SECOND_HTML" | grep -q 'Tank 5'; then exit 1; fi

          curl --fail --silent http://127.0.0.1:8080/about | grep 'About'
          test "$(curl --silent --request POST --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/admin/structure/1/page-type)" = "302"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: unknown.test' http://127.0.0.1:8080/)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/not-implemented)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/media/not-implemented)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/admin/structure)" = "302"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/admin/layouts)" = "302"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/admin/infosystems)" = "302"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:8080/admin/infosystems/1/items?q=Tank')" = "302"

  legacy-database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql:8.0
            client: mysql
            health: mysqladmin ping -h127.0.0.1 -pcms
          - image: mysql:8.4
            client: mysql
            health: mysqladmin ping -h127.0.0.1 -pcms
          - image: mariadb:10.11
            client: mariadb
            health: mariadb-admin ping -h127.0.0.1 -pcms
          - image: mariadb:11.4
            client: mariadb
            health: mariadb-admin ping -h127.0.0.1 -pcms
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: cms
          MYSQL_DATABASE: cms_legacy
          MYSQL_USER: cms
          MYSQL_PASSWORD: cms
        ports: ['3306:3306']
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8089
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cms_legacy
      DB_USER: cms
      DB_PASS: cms
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, dom, mbstring, zip
          coverage: none
      - run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress
      - name: Configure disposable database fixture for non-SUPER trigger creation
        run: docker exec -e MYSQL_PWD=cms "${{ job.services.database.id }}" ${{ matrix.client }} -uroot -e "SET GLOBAL log_bin_trust_function_creators=1;"
      - name: Legacy schema, metadata and repository contracts
        run: |
          php bin/console migrate
          php bin/console migrate | grep 'No pending migrations.'
          php bin/console modules:migrate --all
          php bin/console modules:migrate --all | grep 'No pending migrations for enabled modules.'
          php bin/console extensions:sync
          php bin/console health
          php tests/database_driver_smoke.php
          php tests/document_list_smoke.php
          php tests/content_folders_smoke.php
          php tests/mysql_update_smoke.php
          php tests/mysql_migration_failure_smoke.php
      - name: Prepare dedicated HTTP database
        env:
          MYSQL_PWD: cms
        run: |
          docker exec -e MYSQL_PWD=cms "${{ job.services.database.id }}" ${{ matrix.client }} -uroot -e "CREATE DATABASE cms_legacy_http CHARACTER SET utf8mb4 COLLATE utf8mb4_bin; GRANT ALL ON cms_legacy_http.* TO 'cms'@'%';"
          python3 tools/package_mvp.py /tmp/legacy-webroot.zip --webroot
          mkdir /tmp/legacy-webroot
          unzip -q /tmp/legacy-webroot.zip -d /tmp/legacy-webroot
      - name: Fresh shared-hosting installation and editor journey
        run: |
          env -u APP_ENV -u APP_URL -u DB_DRIVER -u DB_HOST -u DB_PORT -u DB_NAME -u DB_USER -u DB_PASS php -S 127.0.0.1:8089 -t /tmp/legacy-webroot /tmp/legacy-webroot/index.php > /tmp/legacy-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for n in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8089/install; then break; fi
            sleep 1
          done
          python3 tests/legacy_http_smoke.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: legacy-diagnostics-${{ strategy.job-index }}
          path: /tmp/legacy-http.log
          if-no-files-found: ignore

  apache-hosting:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [public, webroot]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cms_apache
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cms -d cms_apache"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MVP_URL: http://127.0.0.1:8086
      MVP_LAYOUT: ${{ matrix.layout }}
      MVP_DB_NAME: cms_apache
      MVP_DB_USER: cms
      MVP_DB_PASS: cms
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, dom, mbstring, zip
          coverage: none
      - run: composer install --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress
      - name: Build real Apache PHP 8.4 fixture
        run: docker build -t cms-apache tests/fixtures/apache
      - name: Package a clean hosting installation
        run: |
          if [ "$MVP_LAYOUT" = webroot ]; then
            python3 tools/package_mvp.py /tmp/apache-hosting.zip --webroot
          else
            python3 tools/package_mvp.py /tmp/apache-hosting.zip
          fi
          mkdir /tmp/cms-apache
          unzip -q /tmp/apache-hosting.zip -d /tmp/cms-apache
          if [ "$MVP_LAYOUT" = webroot ]; then APP_PATH=/tmp/cms-apache/app; else APP_PATH=/tmp/cms-apache; fi
          printf 'CMS_PRIVATE_PROOF' > "$APP_PATH/storage/logs/private-proof.txt"
      - name: Install and edit through Apache with actual htaccess rules
        run: |
          if [ "$MVP_LAYOUT" = webroot ]; then DOCUMENT_ROOT=/var/www/cms; else DOCUMENT_ROOT=/var/www/cms/public; fi
          docker run --detach --name cms-apache --network host -e CMS_DOCUMENT_ROOT="$DOCUMENT_ROOT" -v /tmp/cms-apache:/var/www/cms cms-apache
          trap 'docker logs cms-apache > /tmp/cms-apache.log 2>&1; docker rm -f cms-apache' EXIT
          docker exec cms-apache chown -R www-data:www-data /var/www/cms
          for n in $(seq 1 30); do
            if curl --fail --silent --output /dev/null "$MVP_URL/install"; then break; fi
            sleep 1
          done
          python3 tests/apache_private_files_smoke.py --before-install
          python3 tests/mvp_http_smoke.py
          python3 tests/apache_private_files_smoke.py
          docker exec cms-apache php -r 'if (PHP_VERSION_ID < 80400 || PHP_SAPI !== "cli") exit(1);'
      - name: Prove negative Apache fixture detects private file exposure
        if: matrix.layout == 'webroot'
        run: |
          sed 's/AllowOverride All/AllowOverride None/' tests/fixtures/apache/site.conf > /tmp/apache-unsafe.conf
          docker run --detach --name cms-apache-unsafe --network host -e CMS_DOCUMENT_ROOT=/var/www/cms -v /tmp/cms-apache:/var/www/cms:ro -v /tmp/apache-unsafe.conf:/etc/apache2/sites-available/000-default.conf:ro cms-apache
          trap 'docker logs cms-apache-unsafe > /tmp/cms-apache-unsafe.log 2>&1; docker rm -f cms-apache-unsafe' EXIT
          for n in $(seq 1 30); do
            if curl --silent --output /dev/null "$MVP_URL/app/composer.json"; then break; fi
            sleep 1
          done
          python3 tests/apache_private_files_smoke.py --expect-unsafe
          if python3 tests/apache_private_files_smoke.py; then
            echo 'Protection test incorrectly accepted unsafe hosting'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apache-diagnostics-${{ matrix.layout }}
          path: /tmp/cms-apache*.log
          if-no-files-found: ignore
